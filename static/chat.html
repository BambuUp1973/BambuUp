<!DOCTYPE html>
<!--
  Widget chat Kano Kimonos (profilo cliente finale).
  Configurazione facoltativa, da mettere PRIMA di questo file quando lo si
  incorpora nel sito:
      <script>window.KANO_CHAT = {base: "https://<host-del-bot>", key: "<chiave cliente>"};</script>
  Senza configurazione il widget parla con la stessa origine da cui e' servito
  e non manda nessuna chiave: e' il caso della pagina locale di collaudo, che
  aggiunge la chiave lei stessa.
  Servito su /webchat SENZA configurazione resta volutamente inerte (401).
  Modalita' INCORPORATA (dal 21/09/2026): aperta da static/widget.js dentro un
  iframe con ?embed=1&key=<chiave>&lang=it|en la chiave e la lingua arrivano
  dall'indirizzo, la base e' l'origine della pagina stessa (il bot), e in alto
  compare una X che chiede al genitore di chiudere (postMessage
  {type:"kano-chat-close"}). Dal 22/09/2026 il chat_id lo custodisce la
  pagina del negozio (widget.js): se arriva ?chat=<id> si usa quello e non se
  ne genera un altro; se manca, l'id (nuovo o dalla copia locale) si rimanda al
  genitore con postMessage {type:"kano-chat-id", id}, indirizzato SOLO a
  &origine=<origine del negozio> che widget.js mette nell'URL (mai "*", mai il
  referrer: Safari puo' lasciarlo vuoto); senza origine non parte niente e lo
  si scrive in console. Il localStorage dell'iframe resta come seconda copia.
  Tutto il resto e' identico.
-->
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Chat Kano Kimonos</title>
  <style>
    :root {
      --sfondo: #f6f6f4; --carta: #fff; --bordo: #ddd; --testo: #222; --grigio: #666;
      --cliente: #e3efff; --bot: #f0f0ee; --operatore: #fff4d6; --operatore-bordo: #e0a800;
      --azione: #2b5fb3;
    }
    * { box-sizing: border-box; min-width: 0; }
    /* iOS (22/09/2026): la pagina e' una colonna alta quanto lo schermo VISIBILE
       (100dvh, con 100vh di riserva), il body non scorre, scorre solo la lista
       dei messaggi; barra di scrittura e X restano cosi' sempre in vista, anche
       con la tastiera aperta. Niente piu' largo dello schermo (overflow-x). */
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: var(--sfondo); color: var(--testo); overflow-x: hidden; }
    .kano-chat { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
                 height: 100vh; height: 100dvh;
                 padding: calc(8px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px))
                          calc(8px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px)); }
    .avviso { flex: 0 0 auto; background: var(--carta); border: 1px solid var(--bordo); border-radius: 8px;
              padding: 8px 8px 8px 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .avviso .lingua { display: flex; gap: 4px; align-items: center; flex: 0 0 auto; }
    .avviso .lingua button { font-size: 12px; padding: 4px 8px; border: 1px solid var(--bordo); background: var(--carta); border-radius: 6px; cursor: pointer; color: var(--grigio); }
    .avviso .lingua button.attiva { background: var(--testo); color: #fff; border-color: var(--testo); }
    .stato { flex: 0 0 auto; font-size: 13px; color: var(--grigio); margin: 6px 2px 0; min-height: 18px; }
    .storico { flex: 1 1 auto; min-height: 0; background: var(--carta); border: 1px solid var(--bordo); border-radius: 8px; padding: 12px; margin-top: 8px;
               overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .m { margin: 8px 0; padding: 9px 11px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; max-width: 88%; font-size: 15px; }
    .m .chi { font-size: 11px; color: var(--grigio); margin-bottom: 3px; letter-spacing: .02em; }
    .cliente { background: var(--cliente); margin-left: auto; }
    .cliente.in-attesa { opacity: .6; }
    .cliente.non-inviato { opacity: .5; text-decoration: line-through; }
    .bot { background: var(--bot); margin-right: auto; }
    .operatore { background: var(--operatore); border-left: 4px solid var(--operatore-bordo); margin-right: auto; }
    .operatore .chi { color: #8a6500; font-weight: 600; }
    .operatore.nuovo { animation: lampeggia 1.2s ease-in-out 3; }
    @keyframes lampeggia { 50% { background: #ffe9a8; } }
    .puntini { color: var(--grigio); }
    form { flex: 0 0 auto; display: flex; gap: 8px; margin-top: 8px; }
    /* 16px nel campo: sotto quella misura Safari iOS ingrandisce la pagina al fuoco. */
    input[type=text] { flex: 1; min-width: 0; padding: 11px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; }
    button.invia { padding: 11px 18px; font-size: 16px; border: 0; border-radius: 6px; background: var(--azione); color: #fff; cursor: pointer; flex: 0 0 auto; }
    button.invia:disabled { background: #999; }
    button.operatore-btn { flex: 0 0 auto; margin-top: 8px; padding: 10px 14px; font-size: 14px; border: 1px solid var(--operatore-bordo); background: var(--operatore);
                           color: #5a4300; border-radius: 6px; cursor: pointer; align-self: flex-start; }
    button.operatore-btn:disabled { opacity: .55; cursor: default; }
    /* 44x44: la misura minima toccabile con il dito. */
    .chiudi { display: none; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent;
              color: var(--testo); font-size: 28px; line-height: 44px; cursor: pointer; padding: 0; flex: 0 0 auto; }
    .chiudi:hover { background: var(--bot); }
    body.incorporata .chiudi { display: inline-block; }
  </style>
</head>
<body>
  <div class="kano-chat">
    <div class="avviso">
      <span id="rigaFissa"></span>
      <span class="lingua">
        <button type="button" data-lingua="it">IT</button>
        <button type="button" data-lingua="en">EN</button>
        <button type="button" id="chiudi" class="chiudi" aria-label="Chiudi">&times;</button>
      </span>
    </div>
    <div id="storico" class="storico" aria-live="polite"></div>
    <div id="stato" class="stato"></div>
    <form id="modulo">
      <input id="testo" type="text" autocomplete="off" />
      <button id="invia" class="invia" type="submit"></button>
    </form>
    <button id="operatoreBtn" class="operatore-btn" type="button"></button>
  </div>

<script>
(function () {
  var CONF = window.KANO_CHAT || {};
  var PARAMI = null;
  try { PARAMI = new URLSearchParams(location.search); } catch (e) {}
  var INCORPORATA = !!(PARAMI && PARAMI.get("embed") === "1");
  var BASE, KEY, ORIGINE = null;
  if (INCORPORATA) {
    // Dentro l'iframe del widget: chiave e lingua dall'indirizzo, base = questa
    // stessa origine (il bot). window.KANO_CHAT non viene letto.
    BASE = location.origin;
    KEY = PARAMI.get("key") || null;
    // Origine del negozio che ci incorpora: destinatario dei postMessage.
    // Vale solo se e' un'origine pulita (schema://host[:porta], niente percorso).
    try {
      var o = PARAMI.get("origine");
      if (o && new URL(o).origin === o) ORIGINE = o;
    } catch (e) {}
    document.body.classList.add("incorporata");
  } else {
    BASE = (CONF.base || "").replace(/\/+$/, "");
    KEY = CONF.key || null;
  }
  var OGNI_MS = 15000;

  var T = {
    it: {
      fissa: "Assistente automatico di Kano Kimonos. Per parlare con una persona usa il bottone qui sotto.",
      scrivi: "Scrivi qui il tuo messaggio",
      invia: "Invia",
      operatore: "Parla con un operatore",
      tu: "Tu", bot: "Assistente", op: "Operatore Kano",
      attesa: "Un operatore ti risponderà qui in chat: puoi chiudere e tornare più tardi, la conversazione resta.",
      nuovo: "Nuovo messaggio dell'operatore",
      errore_rete: "Non riesco a collegarmi in questo momento: riprova fra poco.",
      nessuna_risposta: "Non ho ricevuto una risposta: riprova fra poco."
    },
    en: {
      fissa: "Kano Kimonos automated assistant. To talk to a person use the button below.",
      scrivi: "Type your message here",
      invia: "Send",
      operatore: "Talk to an operator",
      tu: "You", bot: "Assistant", op: "Kano operator",
      attesa: "An operator will reply here in the chat: you can close this and come back later, the conversation stays.",
      nuovo: "New message from the operator",
      errore_rete: "I can't connect right now: please try again in a moment.",
      nessuna_risposta: "I didn't get a reply: please try again in a moment."
    }
  };

  function leggi(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function scrivi(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ?chat=<id> nell'indirizzo riprende una conversazione precisa (assistenza,
  // collaudo): viene salvata e da li' in poi vale come le altre.
  var daUrl = null;
  try { daUrl = new URLSearchParams(location.search).get("chat"); } catch (e) {}
  if (daUrl && !/^[A-Za-z0-9._:-]{4,120}$/.test(daUrl)) daUrl = null;
  if (daUrl) scrivi("kano_chat_id", daUrl);
  var chatId = daUrl || leggi("kano_chat_id");
  if (!chatId) {
    var r = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
    chatId = "WEB-" + r;
    scrivi("kano_chat_id", chatId);
  }
  if (INCORPORATA && !daUrl && window.parent && window.parent !== window) {
    // Il genitore non lo conosceva: glielo si consegna perche' lo custodisca
    // lui (storage di prima parte) e lo rimandi come ?chat= alla prossima
    // apertura. Solo all'origine dichiarata nell'URL: senza, niente.
    if (ORIGINE) window.parent.postMessage({ type: "kano-chat-id", id: chatId }, ORIGINE);
    else console.warn("kano chat: origine del negozio assente nell'URL, chat_id non consegnato al genitore");
  }
  var lingua = leggi("kano_chat_lingua") || ((navigator.language || "it").toLowerCase().indexOf("it") === 0 ? "it" : "en");
  if (INCORPORATA) {
    // La lingua della pagina del negozio vince: e' quella che il cliente sta leggendo.
    var lang = (PARAMI.get("lang") || "").toLowerCase().slice(0, 2);
    if (lang === "it" || lang === "en") lingua = lang;
  }

  var storico = document.getElementById("storico");
  var stato = document.getElementById("stato");
  var testo = document.getElementById("testo");
  var invia = document.getElementById("invia");
  var opBtn = document.getElementById("operatoreBtn");
  var ultimoId = 0;
  var aperta = false;
  var timer = null;
  var titoloBase = document.title;

  function t(k) { return T[lingua][k]; }

  function applicaLingua() {
    document.documentElement.lang = lingua;
    document.getElementById("rigaFissa").textContent = t("fissa");
    testo.placeholder = t("scrivi");
    invia.textContent = t("invia");
    opBtn.textContent = t("operatore");
    var bottoni = document.querySelectorAll(".lingua button");
    for (var i = 0; i < bottoni.length; i++) bottoni[i].classList.toggle("attiva", bottoni[i].getAttribute("data-lingua") === lingua);
    var etichette = storico.querySelectorAll(".m");
    for (var j = 0; j < etichette.length; j++) {
      var chi = etichette[j].querySelector(".chi");
      if (!chi) continue;
      if (etichette[j].classList.contains("cliente")) chi.textContent = t("tu");
      else if (etichette[j].classList.contains("operatore")) chi.textContent = t("op");
      else chi.textContent = t("bot");
    }
    stato.textContent = aperta ? t("attesa") : "";
  }
  var bottoniLingua = document.querySelectorAll(".lingua button");
  for (var b = 0; b < bottoniLingua.length; b++) {
    bottoniLingua[b].addEventListener("click", function () {
      lingua = this.getAttribute("data-lingua"); scrivi("kano_chat_lingua", lingua); applicaLingua();
    });
  }

  function intestazioni(json) {
    var h = {};
    if (json) h["Content-Type"] = "application/json";
    if (KEY) h["x-bot-client-key"] = KEY;
    return h;
  }

  function bolla(da, contenuto, extra) {
    var d = document.createElement("div");
    d.className = "m " + da + (extra ? " " + extra : "");
    var chi = document.createElement("div");
    chi.className = "chi";
    chi.textContent = da === "cliente" ? t("tu") : (da === "operatore" ? t("op") : t("bot"));
    d.appendChild(chi);
    d.appendChild(document.createTextNode(contenuto));
    storico.appendChild(d);
    storico.scrollTop = storico.scrollHeight;
    return d;
  }

  function mostraMessaggi(lista, evidenziaOperatore) {
    var arrivatoOperatore = false;
    for (var i = 0; i < lista.length; i++) {
      var m = lista[i];
      if (m.id <= ultimoId) continue;
      bolla(m.da, m.content, (m.da === "operatore" && evidenziaOperatore) ? "nuovo" : "");
      ultimoId = m.id;
      if (m.da === "operatore") arrivatoOperatore = true;
    }
    if (arrivatoOperatore && evidenziaOperatore) {
      document.title = "● " + titoloBase;
      setTimeout(function () { document.title = titoloBase; }, 8000);
    }
  }

  function aggiornaStato(nuovaAperta) {
    aperta = !!nuovaAperta;
    opBtn.disabled = aperta;
    stato.textContent = aperta ? t("attesa") : "";
    if (aperta && !timer) timer = setInterval(sincronizza, OGNI_MS);
    if (!aperta && timer) { clearInterval(timer); timer = null; }
  }

  function sincronizza(evidenzia) {
    var url = BASE + "/chat/" + encodeURIComponent(chatId) + "/messaggi" + (ultimoId ? "?dopo_id=" + ultimoId : "");
    return fetch(url, { headers: intestazioni(false) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return null;
        var pendenti = storico.querySelectorAll(".in-attesa");
        for (var i = 0; i < pendenti.length; i++) pendenti[i].remove();
        mostraMessaggi(d.messaggi || [], evidenzia !== false);
        aggiornaStato(d.richiesta_aperta);
        return d;
      })
      .catch(function () { return null; });
  }

  document.getElementById("modulo").addEventListener("submit", function (e) {
    e.preventDefault();
    var msg = testo.value.trim();
    if (!msg) return;
    testo.value = "";
    invia.disabled = true;
    var mia = bolla("cliente", msg, "in-attesa");
    var puntini = bolla("bot", "…", "puntini");
    fetch(BASE + "/chat", {
      method: "POST", headers: intestazioni(true),
      body: JSON.stringify({ source: "web", sender: "Cliente", chat_id: chatId, message: msg, role: "retail" })
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (x) {
      puntini.remove();
      if (x.ok && x.d && x.d.status === "saved") {
        return sincronizza(true);
      }
      mia.classList.remove("in-attesa"); mia.classList.add("non-inviato");
      bolla("bot", (x.d && (x.d.reply || x.d.detail)) || t("nessuna_risposta"));
    }).catch(function () {
      puntini.remove();
      mia.classList.remove("in-attesa"); mia.classList.add("non-inviato");
      bolla("bot", t("errore_rete"));
    }).then(function () { invia.disabled = false; testo.focus(); });
  });

  opBtn.addEventListener("click", function () {
    opBtn.disabled = true;
    fetch(BASE + "/richieste/apri", {
      method: "POST", headers: intestazioni(true),
      body: JSON.stringify({ chat_id: chatId, tipo: "cliente_chiede", lingua: lingua })
    }).then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.esito === "aperta") {
          return sincronizza(false).then(function () { aggiornaStato(true); });
        }
        if (d.testo) bolla("bot", d.testo);
        aggiornaStato(d.richiesta_aperta);
      })
      .catch(function () { bolla("bot", t("errore_rete")); opBtn.disabled = false; });
  });

  document.getElementById("chiudi").addEventListener("click", function () {
    if (window.parent && window.parent !== window) window.parent.postMessage({ type: "kano-chat-close" }, ORIGINE || "*");
  });

  applicaLingua();
  sincronizza(false);
})();
</script>
</body>
</html>
